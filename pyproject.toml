[project]
name = "wizard-app-manager"
version = "0.1.0"
description = "Finds Wizard apps, checks them, compiles them into a stock Runtipi store, installs them, and writes apps.json."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
license = {text = "GPL-3.0-only"}

[project.optional-dependencies]
test = ["pytest>=8", "ruamel.yaml>=0.18", "PyJWT>=2"]

[project.scripts]
wam = "wam.cli:main"

[tool.setuptools]
packages = ["wam", "wam.backup", "wam.vendor", "wam.vendor.wizard_os_plugin"]

[tool.setuptools.package-data]
"wam" = ["defaults.json", "release-index.mjs"]
"wam.vendor" = ["SOURCE.json"]
"wam.vendor.wizard_os_plugin" = ["plugin.yaml"]
