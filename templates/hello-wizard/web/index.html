<html lang="en" data-app="hello-wizard"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Habits · Wizard</title><link rel="stylesheet" href="styles.css"><script defer src="theme-client.js"></script><script defer src="app.js"></script></head><body><main><header><span aria-hidden="true" class="sigil">◦</span><h1>Habits</h1></header><p id="day" class="muted"></p><form id="add-form"><input id="habit-name" aria-label="New habit name" placeholder="e.g. Drink water" maxlength="60" autocomplete="off" required><button id="add" type="submit">Add</button></form><p id="empty" class="empty" hidden>No habits yet.<br><span class="muted">Add one above to start tracking today.</span></p><ul id="habits" aria-label="Your habits"></ul><p id="status" role="status" aria-live="polite"></p><footer>Local to this Wizard · API + MCP included</footer></main></body></html>
