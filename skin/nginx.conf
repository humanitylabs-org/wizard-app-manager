# wizard-skin: sits between Traefik and the stock Runtipi dashboard (runtipi:3000) and adds one
# <link> to the Wizard UX stylesheet. Everything else (auth headers, API, live updates) passes through.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;
  server_tokens off;
  client_max_body_size 1g;

  map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

  server {
    listen 8080;

    location = /__wizard/skin.css {
      alias /srv/skin/wizard.css;
      default_type text/css;
      add_header Cache-Control "no-cache";
    }

    location / {
      proxy_pass http://runtipi:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";          # plain HTML so the <link> can be added
      proxy_buffering off;                          # live install/log streams
      proxy_read_timeout 1h;

      sub_filter_once on;
      sub_filter "</head>" '<link rel="stylesheet" href="/__wizard/skin.css"><meta name="theme-color" content="#05030c"></head>';
    }
  }
}
