# Tells the WizardOS release train (humanitylabs-org/wizard-os .github/workflows/release-cut.yml) that main has a
# new publishable commit, so it reaches For testers (latest) within minutes (at most one cut per 30 min there).
# Release mirror merges (`*-mirror-train` branches) are skipped: they only copy releases/.
# Runs after a green `test` or `image` run on main, and dispatches only once every `test`/`image` run for that commit
# has finished green (image-affecting commits wait for their image; whichever finishes last dispatches); never checks
# out or runs this repo's code. Uses the org secret
# RELEASE_TRAIN_TOKEN (the release train's one token; wizard-os docs/RELEASE_AUTOMATION.md "Owner setup"). Without
# it the step says so and passes: the train's daily sweep still picks the commit up.
name: Release train notify
on:
  workflow_run:
    workflows: [test, image]
    types: [completed]
    branches: [main]
permissions:
  actions: read
concurrency:
  group: release-train-notify
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, '-mirror-train')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for every test/image run on this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "test" or .name == "image")]')
          pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
          failed=$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$runs")
          if [ "$failed" != 0 ]; then echo "::notice::a test/image run for $SHA did not pass; not dispatching"; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$pending" != 0 ]; then echo "::notice::$pending test/image run(s) for $SHA still running; the last one to finish dispatches"; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      # 12 Nov 2026: the train's writer is the GitHub App WizardOS Builder (the wizardosbuilder user was suspended).
      - name: WizardOS Builder app token
        id: app
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true   # no key here: the empty-token guard below passes; the daily sweep still cuts
        uses: actions/create-github-app-token@v1
        with:
          app-id: 5723441
          private-key: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}
          owner: humanitylabs-org
          repositories: wizard-os
      - name: Dispatch component-published to wizard-os
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RELEASE_TRAIN_TOKEN is not shared with this repo; the release train's daily sweep will cut $SHA"
            exit 0
          fi
          gh api -X POST repos/humanitylabs-org/wizard-os/dispatches -f event_type=component-published \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" -f "client_payload[sha]=$SHA" -f "client_payload[run]=$RUN"
          echo "release train notified: $GITHUB_REPOSITORY@$SHA"
