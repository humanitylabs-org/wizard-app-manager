name: image
# Builds and publishes the Wizard App Manager image to GHCR on every push to main (and on demand), for amd64 and arm64.
# Each architecture builds on its own native runner (no QEMU: the bun/node build is very slow emulated) and pushes by
# digest; the publish job then joins both digests into the :latest and versioned multi-arch tags.
# Pull requests that touch the image build both architectures without publishing anything.
# Uses the workflow's own token, so no personal access token is needed.
on:
  push:
    branches: [main]
    paths: ["packages/**", "Dockerfile", ".dockerignore", "package.json", "bun.lock", "turbo.json", "wam/hermes-lock.json", "releases/hermes-lock.json", ".github/workflows/image.yml"]
  pull_request:
    paths: ["packages/**", "Dockerfile", ".dockerignore", "package.json", "bun.lock", "turbo.json", "wam/hermes-lock.json", "releases/hermes-lock.json", ".github/workflows/image.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/humanitylabs-org/wizard-app-manager
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      # Keep the other architecture's diagnostics if one fails or times out.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          # Built from x86: the JS stages run natively there; only the small runner stage runs under QEMU.
          - platform: linux/arm64
            runner: ubuntu-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "tag=v4.10.2-wizard.$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            LOCAL=true
            TIPI_VERSION=${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/humanitylabs-org/wizard-app-manager
            org.opencontainers.image.description=Wizard App Manager (Runtipi v4.10.2 with an index-backed App Store)
            org.opencontainers.image.licenses=GPL-3.0
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Keep the digest for the publish job
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          d='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "tag=v4.10.2-wizard.$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tags (version verified before latest)
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.v.outputs.tag }}
        run: |
          shopt -s nullglob
          digests=(*)
          [[ ${#digests[@]} -eq 2 ]] || { echo 'Expected two architecture digests' >&2; exit 1; }
          sources=()
          for digest in "${digests[@]}"; do
            [[ $digest =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create -t "$IMAGE:$VERSION" "${sources[@]}"
          check_platforms() {
            docker buildx imagetools inspect --raw "$1" > "$RUNNER_TEMP/manifest.json"
            python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              manifest = json.load(f)
          platforms = {(m.get('platform', {}).get('os'), m.get('platform', {}).get('architecture'))
                       for m in manifest.get('manifests', [])}
          required = {('linux', 'amd64'), ('linux', 'arm64')}
          if not required <= platforms:
              raise SystemExit(f'Missing required image platforms: {required - platforms}')
          PY
          }
          check_platforms "$IMAGE:$VERSION"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
          check_platforms "$IMAGE:latest"

  attest:
    # Signed build provenance: records that this exact image digest was built by this repo's CI from this commit.
    # Verify: gh attestation verify oci://ghcr.io/humanitylabs-org/wizard-app-manager@<digest> --owner humanitylabs-org
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Index digest of the versioned tag
        id: index
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          d=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest $d" >&2; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
