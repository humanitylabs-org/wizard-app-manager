name: image
# Builds and publishes the Wizard App Manager image to GHCR on every push to main (and on demand).
# Uses the workflow's own token, so no personal access token is needed.
on:
  push:
    branches: [main]
    paths: ["packages/**", "Dockerfile", "package.json", "bun.lock", "turbo.json", ".github/workflows/image.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "tag=v4.10.2-wizard.$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            LOCAL=true
            TIPI_VERSION=${{ steps.v.outputs.tag }}
          tags: |
            ghcr.io/humanitylabs-org/wizard-app-manager:latest
            ghcr.io/humanitylabs-org/wizard-app-manager:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/humanitylabs-org/wizard-app-manager
            org.opencontainers.image.description=Wizard App Manager (Runtipi v4.10.2 with an index-backed App Store)
            org.opencontainers.image.licenses=GPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
