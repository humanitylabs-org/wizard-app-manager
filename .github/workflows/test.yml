name: test
on:
  push:
    branches: ['**']  # curator/* tags contain mirrored app source, not WAM changes
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Backup source real-filesystem regression
        run: nice -n 19 node --test tests/backup-source-safety.test.mjs
      - run: bun run build
        working-directory: packages/common
      - name: Private app permissions real-filesystem lifecycle regression
        run: nice -n 19 node --test tests/private-data-permissions.test.mjs
      - run: bun run test
        working-directory: packages/backend
      - run: bun x tsgo --noEmit
        working-directory: packages/backend
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml pytest pyjwt
      - name: Portable paths guard
        run: python tests/test_portable_paths.py
      - name: Verify canonical snapshot and strict new-app styles
        run: |
          python tools/sync_wizard_style.py --check
          python -m wam.style_check templates/hello-wizard --policy wam/style-policy.json --strict
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node --test tests/runtipi-open.test.mjs tests/connections-map.test.mjs
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - run: bun test tests/curator-mirrors.test.ts
  builder-verify:
    # The platform is tested once: every template kind passes the same `wam verify` an owner's agent runs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml
      - name: wam verify, list kind (receipt with elapsed time and memory)
        run: |
          python -m wam new verify-todo --kind list --dev-root "$RUNNER_TEMP/dev" --request 'a to-do list'
          python -m wam.style_check "$RUNNER_TEMP/dev/verify-todo" --policy wam/style-policy.json --strict
          python -m wam verify "$RUNNER_TEMP/dev/verify-todo" --out "$RUNNER_TEMP/shots/list"
          ls -la "$RUNNER_TEMP/shots/list"
      - name: wam verify, hello kind (declared verify.json)
        run: |
          python -m wam new verify-hello --dev-root "$RUNNER_TEMP/dev" --request 'hello'
          python -m wam verify "$RUNNER_TEMP/dev/verify-hello" --no-screenshot
      - name: nothing left behind
        run: |
          test -z "$(docker ps -aq --filter name=wam-verify)" && test -z "$(docker images -q --filter 'reference=wam-verify-*')"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wam-verify-screenshots, path: "${{ runner.temp }}/shots", if-no-files-found: ignore}
