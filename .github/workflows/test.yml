name: test
on:
  push:
    branches: ['**']  # curator/* tags contain mirrored app source, not WAM changes
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml pytest pyjwt
      - name: Portable paths guard
        run: python tests/test_portable_paths.py
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node --test tests/runtipi-open.test.mjs
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - run: bun test tests/curator-mirrors.test.ts
