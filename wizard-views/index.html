<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05030c">
  <title>Wizard apps</title>
  <link rel="stylesheet" href="wux.css">
  <link rel="stylesheet" href="wizard-apps.css">
  <link rel="stylesheet" href="standalone.css">
  <script type="module" src="standalone.js"></script>
</head>
<body class="wux">
  <div class="admin">
    <button id="adminBtn" aria-haspopup="menu" aria-expanded="false">Admin ▾</button>
    <div id="adminMenu" role="menu" hidden>
      <a href="#apps" role="menuitem">My Apps</a>
      <a href="#store" role="menuitem">App Store</a>
      <a href="#resources" role="menuitem">Resources</a>
      <a href="#connections" role="menuitem">Connections</a>
      <a href="https://wam.whereismiguel.com/" role="menuitem" target="_blank" rel="noopener">Runtipi admin</a>
    </div>
  </div>
  <main class="wux-sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="wux-body" id="body"></div>
    <div id="chips" hidden></div>
    <form class="search" id="searchForm" autocomplete="off" hidden>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search the App Store" enterkeyhint="search" spellcheck="false">
    </form>
  </main>
</body>
</html>
