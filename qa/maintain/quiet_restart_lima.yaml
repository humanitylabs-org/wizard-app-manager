# Disposable maintenance rig only. No owner mounts or automatic package upgrades.
minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
cpus: 2
memory: 3GiB
disk: 12GiB
mounts: []
upgradePackages: false
containerd:
  system: false
  user: false
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      systemctl mask --now apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service unattended-upgrades.service
